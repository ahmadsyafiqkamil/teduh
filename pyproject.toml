[project]
name = "teduh"
version = "0.1.0"
description = "AI agent untuk perencanaan mitigasi Urban Heat Island tingkat kelurahan"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk>=1.0",
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "lightgbm>=4.3",
    "shap>=0.45",
    "scikit-learn>=1.5",
    "ortools>=9.10",
    "markdown-it-py>=3.0",
    "weasyprint>=62",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "openai>=3.26.1",
]
# Offline only. Never imported by teduh_agent/, model/, or api/ (CLAUDE.md rule 6).
pipeline = [
    "earthengine-api>=1.0",
    "google-api-python-client>=2.130",
    "geopandas>=1.0",
    "rasterio>=1.3",
    "scipy>=1.13",
    "openpyxl>=3.1",
    "pypdf>=4.2",
    "pillow>=10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teduh_agent", "model", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fungsi murni, tanpa I/O",
    "integration: menyentuh artefak data atau HTTP",
    "slow: latih model atau panggil Gemini",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["teduh_agent", "model", "api"]
