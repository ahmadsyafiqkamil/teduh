<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span tabIndex="0" onMouseEnter="{{ show }}" onMouseLeave="{{ hide }}" onFocus="{{ show }}" onBlur="{{ hide }}" style="position:relative; display:inline-flex; align-items:center; gap:3px; font-variant-numeric:tabular-nums; cursor:help; border-bottom:1px {{ lineStyle }} #5E6662; line-height:1.25; white-space:nowrap; border-radius:2px" style-focus="outline:2px solid #1F5C4A; outline-offset:2px"><span>{{ display }}</span><svg width="11" height="11" viewBox="0 0 24 24" style="fill:none; stroke:#5E6662; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; flex:none"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg><sc-if value="{{ open }}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position:absolute; left:{{ tipLeft }}; right:{{ tipRight }}; transform:{{ tipTransform }}; top:{{ tipTop }}; bottom:{{ tipBottom }}; width:252px; background:#1C2321; color:#FFFFFF; border-radius:8px; padding:10px 12px; font-size:12.5px; font-weight:400; line-height:1.45; white-space:normal; text-align:left; z-index:80; box-shadow:0 8px 24px rgba(28,35,33,.18); display:flex; flex-direction:column; gap:4px; pointer-events:none"><span style="font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:{{ kindColor }}">{{ kindLabel }}</span><span>{{ sourceText }}</span></span></sc-if></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;260px&quot;,&quot;height&quot;:&quot;140px&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;37,4&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;unit&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;°C&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;data&quot;,&quot;model&quot;,&quot;literatur&quot;,&quot;asumsi&quot;,&quot;input&quot;],&quot;default&quot;:&quot;data&quot;,&quot;tsType&quot;:&quot;'data'|'model'|'literatur'|'asumsi'|'input'&quot;},&quot;source&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Landsat 8/9, musim kemarau 2023–2025&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placement&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;bottom&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;'top'|'bottom'&quot;},&quot;align&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;center&quot;,&quot;start&quot;,&quot;end&quot;],&quot;default&quot;:&quot;center&quot;,&quot;tsType&quot;:&quot;'center'|'start'|'end'&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const p = this.props, k = p.kind || 'data', u = p.unit;
    const labels = { data: 'Sumber · Data satelit', model: 'Sumber · Model & perhitungan TEDUH', literatur: 'Sumber · Literatur', asumsi: 'ASUMSI · dapat diedit', input: 'Sumber · Masukan pengguna' };
    const below = p.placement === 'bottom', al = p.align || 'center';
    return {
      open: this.state.open,
      show: () => this.setState({ open: true }),
      hide: () => this.setState({ open: false }),
      display: (p.value ?? '—') + (u ? (u === '%' ? '' : '\u00A0') + u : ''),
      kindLabel: labels[k] || k,
      sourceText: p.source || 'Sumber belum dicantumkan',
      lineStyle: k === 'asumsi' || k === 'input' ? 'dashed' : 'dotted',
      kindColor: k === 'asumsi' ? '#E3DED4' : '#8BB59A',
      tipTop: below ? 'calc(100% + 8px)' : 'auto',
      tipBottom: below ? 'auto' : 'calc(100% + 8px)',
      tipLeft: al === 'center' ? '50%' : al === 'start' ? '0' : 'auto',
      tipRight: al === 'end' ? '0' : 'auto',
      tipTransform: al === 'center' ? 'translateX(-50%)' : 'none'
    };
  }
}
</script>
</body>
</html>
